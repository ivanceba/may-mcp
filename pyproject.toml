[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "may-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for the May vehicle manager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "pyjwt[crypto]>=2.10,<3",
    "starlette>=1.10,<2",
    "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/ivanceba/may-mcp"
Issues = "https://github.com/ivanceba/may-mcp/issues"

[project.scripts]
may-mcp = "may_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/may_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/superpowers", ".agents/skills"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests against an isolated May instance or container"]

[tool.uv]
required-version = "==0.11.8"
build-constraint-dependencies = [
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]
